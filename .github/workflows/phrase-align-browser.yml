name: Phrase alignment browser regression
on:
  pull_request:
    branches: [gh-pages]
    paths:
      - 'music-render.js'
      - 'tests/phrase-align-browser*'
      - '.github/workflows/phrase-align-browser.yml'
  workflow_dispatch:
jobs:
  verify-rendering:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/phrase-align-http.log 2>&1 &
      - run: node tests/phrase-align-browser.cjs
