name: Add conference AV flashcards

on:
  push:
    branches:
      - chatgpt/conference-av-flashcards

permissions:
  contents: write

jobs:
  update-recordings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/conference-av-flashcards
          fetch-depth: 0
      - name: Add conference AV playlist
        shell: python
        run: |
          import json
          from pathlib import Path

          path = Path("db/language/swedish/recordings.json")
          data = json.loads(path.read_text(encoding="utf-8"))

          qa = [
            ("Vad är den viktigaste mentala modellen vid AV-felsökning?", "Följ signalvägen: dator → port → adapter eller docka → kabel → vägguttag eller switch → projektor eller skärm → vald input."),
            ("Vad betyder “No Signal” på en projektor?", "Projektorn är igång men tar inte emot en giltig videosignal på den valda ingången."),
            ("Vilka tre saker bör du kontrollera först vid “No Signal”?", "Att projektorn är på, att rätt Source eller Input är vald och att kabeln sitter ordentligt."),
            ("Vilken Windows-genväg används för externa skärmar?", "Win + P."),
            ("Vad är skillnaden mellan Duplicera och Utöka?", "Duplicera visar samma bild på båda skärmarna. Utöka gör projektorn till en separat skrivbordsyta."),
            ("Varför kan skrivbordet synas men inte PowerPoint-presentationen?", "Datorn kan stå i Utöka-läge och presentationen ligger på den andra skärmen eller används i Presentatörsvy."),
            ("Vad kan HDMI transportera?", "Digital bild och ljud."),
            ("Vad är DisplayPort?", "En digital displaystandard, vanlig på datorer och dockor, som kan bära bild och ljud."),
            ("Kan DisplayPort gå genom USB-C?", "Ja, via DisplayPort Alt Mode om porten, kabeln och resten av kedjan stöder det."),
            ("Varför garanterar en USB-C-kontakt inte bild?", "USB-C beskriver kontaktformen. Porten kan ha olika funktioner och måste stödja video, exempelvis DisplayPort Alt Mode."),
            ("Vad är DisplayPort Alt Mode?", "Ett sätt att skicka DisplayPort-video genom en USB-C-anslutning."),
            ("Varför kan en docka ladda datorn men ändå inte ge bild?", "Ström via USB Power Delivery kan fungera även om videovägen saknas, inte stöds eller har ett separat fel."),
            ("Vad är Thunderbolt i det här sammanhanget?", "En teknik över USB-C som kan bära snabb data, DisplayPort-video och ström, med tydligare kapacitetskrav än en vanlig USB-C-port."),
            ("Varför kan två USB-C-kablar som ser likadana ut fungera olika?", "De kan stödja olika datahastigheter, videofunktioner, effekt och protokoll trots att kontakterna ser likadana ut."),
            ("Vad är Hot Plug Detect, HPD?", "En signal som talar om för datorn att en bildskärm eller projektor har anslutits."),
            ("Vad är EDID?", "Information från skärmen till datorn om bland annat identitet, stödda upplösningar och uppdateringsfrekvenser."),
            ("Hur kan ett EDID-problem märkas?", "Som konstig upplösning, fel uppdateringsfrekvens, fel skärmid eller att datorn väljer ett olämpligt bildläge."),
            ("Vad menas med HDMI-handshake?", "Processen där enheterna upptäcker varandra, utbyter displayinformation och vid behov autentiserar HDCP."),
            ("Varför hjälper det ibland att dra ur och sätta tillbaka HDMI-kabeln?", "Det triggar en ny detektion och kan starta om EDID- och HDCP-förhandlingen."),
            ("Vad är HDCP?", "Ett kopieringsskydd som autentiserar bildkedjan för visst skyddat digitalt innehåll."),
            ("Skrivbordet fungerar men skyddad streamingvideo blir svart. Vad misstänker du?", "Ett HDCP-problem i någon del av signalkedjan."),
            ("Vad betyder upplösningen 1920 × 1080?", "Bilden är 1920 pixlar bred och 1080 pixlar hög, ungefär 2,1 miljoner pixlar totalt."),
            ("Vad betyder 60 Hz?", "Skärmen uppdaterar bilden ungefär 60 gånger per sekund."),
            ("Varför kräver 4K60 mycket mer bandbredd än 1080p60?", "4K har fyra gånger så många pixlar som 1080p vid samma uppdateringsfrekvens."),
            ("Vad är färgdjup?", "Hur många nivåer som används för varje färgkanal, exempelvis 8, 10 eller 12 bitar."),
            ("Vad händer med bandbreddsbehovet när färgdjupet ökar?", "Det ökar eftersom mer information skickas för varje pixel."),
            ("Vad är chroma subsampling?", "En metod som minskar mängden färginformation för att spara bandbredd."),
            ("Vad betyder 4:4:4?", "Full färgupplösning för varje pixel, vilket är särskilt bra för skarp text och datorgrafik."),
            ("Varför är 4:4:4 extra bra för presentationer, webbsidor och Excel?", "Små bokstäver och skarpa färgkanter blir tydligare än vid kraftigare chroma-subsampling."),
            ("1080p60 är stabilt men 4K60 blinkar. Vad är en stark misstanke?", "Bandbredds- eller signalkvalitetsproblem i exempelvis kabel, docka, switch eller extender."),
            ("Varför är testet 4K60 → 4K30 användbart?", "Om 4K30 fungerar men 4K60 inte gör det tyder det på att kedjan kan ligga nära sin bandbreddsgräns."),
            ("Varför påverkar långa kablar högupplöst video mer?", "Signalkvaliteten försämras med längden och högre datahastigheter har mindre marginal."),
            ("Vad menas med en digital cliff?", "Signalen kan se perfekt ut tills kvaliteten passerar en gräns och bilden plötsligt börjar blinka, få avbrott eller försvinna."),
            ("Vad är MST?", "Multi-Stream Transport, en DisplayPort-funktion som kan bära flera separata bildströmmar över en länk."),
            ("Varför kan en docka klara en 4K-skärm men inte två?", "Två skärmar delar på tillgänglig displaybandbredd och datorns display-controller kan också sätta en gräns."),
            ("Bevisar två HDMI-uttag på dockan att två 4K-skärmar fungerar?", "Nej. Datorn, GPU:n, länken och dockan måste alla stödja den kombinationen."),
            ("Vad är skillnaden mellan DisplayPort och DisplayLink?", "DisplayPort är en vanlig videosignal. DisplayLink skickar bild via USB-data med programvara och ett DisplayLink-chip i dockan eller adaptern."),
            ("Vad betyder Input i ljudinställningar?", "Ljud som går in i datorn, normalt från mikrofonen."),
            ("Vad betyder Output i ljudinställningar?", "Ljud som går ut från datorn till exempelvis högtalare, projektor eller headset."),
            ("Du hör alla andra, men ingen hör dig. Vilken väg felsöker du?", "Mikrofonvägen: rätt input, mute, nivåmätare, USB-anslutning och appbehörigheter."),
            ("Alla hör dig, men du hör ingen. Vilken väg felsöker du?", "Ljudutgången: rätt högtalare eller output, volym och vald ljudenhet i mötesappen."),
            ("Varför kan ljudet plötsligt gå till projektorn?", "HDMI kan bära ljud och projektorn kan automatiskt väljas som ny ljudutgång."),
            ("Vad är AEC?", "Acoustic Echo Cancellation, som försöker ta bort högtalarljud ur mikrofonsignalen så att motparten inte hör sitt eget ljud som eko."),
            ("Varför kan två laptops i samma möte skapa rundgång?", "Om båda har mikrofon och högtalare aktiva kan ljudet matas tillbaka mellan enheterna."),
            ("Vilka tre enheter bör du kontrollera separat i Teams eller Zoom?", "Högtalare, mikrofon och kamera."),
            ("Varför kan Windows och Teams använda olika högtalare?", "Mötesappen kan ha ett eget enhetsval som skiljer sig från operativsystemets standardenhet."),
            ("Vad visar en rörlig mikrofon-nivåmätare?", "Att mikrofonsignalen åtminstone når den nivå där mätaren visas, exempelvis operativsystemet eller mötesappen."),
            ("Vad är BYOD i ett konferensrum?", "Bring Your Own Device: din laptop kör mötet och använder rummets skärm, kamera, mikrofon och högtalare."),
            ("Är skärmdelning och kameravideo samma dataström?", "Nej. De är separata, så den ena kan fungera även om den andra inte gör det."),
            ("Vad är den bästa generella felsökningsprincipen?", "Isolera signalvägen och ändra en sak i taget så att du vet vilken länk som orsakar felet."),
            ("Vilket direkt-test är bäst för att isolera konferensrummets infrastruktur?", "Koppla laptopen direkt till projektorn eller skärmen, exempelvis med HDMI, och bypassa docka, vägguttag och switch."),
            ("Direktkoppling fungerar men rummets vanliga signalväg fungerar inte. Vad vet du?", "Laptop och projektor kan kommunicera. Felet ligger sannolikt i infrastrukturen mellan dem."),
            ("En annan laptop fungerar i samma rum. Vad pekar det på?", "Fokusera på den första datorns port, adapter, drivrutiner eller inställningar."),
            ("Ingen laptop fungerar i samma rum. Vad pekar det på?", "Misstänk konferensrummets kabel, switch, docka, valda input eller annan gemensam infrastruktur."),
            ("Varför ska du inte ändra fem inställningar samtidigt när du felsöker?", "Då tappar du orsakssambandet och vet inte vilken ändring som faktiskt påverkade problemet."),
          ]

          base = 1792051200000
          cards = []
          for pos, (question, answer) in enumerate(qa, start=1):
              stamp = base + pos
              cards.append({
                  "file": f"manual__{stamp}.mp4",
                  "title": question,
                  "recStart": 0,
                  "recEnd": 1,
                  "recStartPres": 0,
                  "recEndPres": 1,
                  "recSubtitle": "",
                  "recSubtitleTime": 0,
                  "recPlaySrcTgtGapSeconds": 0,
                  "position": pos,
                  "category": "Konferensrum AV",
                  "source": question,
                  "target": answer,
                  "manual": True,
                  "addedAt": stamp,
              })

          data["Konferensrum AV"] = cards
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          # Remove this one-time workflow so it does not remain in the PR.
          Path(".github/workflows/add-conference-av-playlist.yml").unlink(missing_ok=True)
      - name: Commit generated playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db/language/swedish/recordings.json .github/workflows/add-conference-av-playlist.yml
          git commit -m "Add conference room AV flashcard playlist"
          git push origin HEAD:chatgpt/conference-av-flashcards
