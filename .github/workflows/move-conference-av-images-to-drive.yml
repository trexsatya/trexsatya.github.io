name: Move conference AV images to Drive
on:
  push:
    branches: [chatgpt/conference-av-visual-scenarios]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace repo image URLs with Drive URLs and remove SVG assets
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('db/language/swedish/recordings.json')
          s=p.read_text()
          mapping={
            'signal-chain.svg':'https://drive.google.com/file/d/1E_B7DwIiNyHkPINjQ6qxboKz23aHP_Z6/view?usp=drivesdk',
            'usb-c-functions.svg':'https://drive.google.com/file/d/1rJ5PGifsMCxR2ZXM7Hl4-4Zr-cJJC-VI/view?usp=drivesdk',
            'handshake-edid-hdcp.svg':'https://drive.google.com/file/d/1LyKRuNtj75pqMbJVrvlR5-cvgyT-GLEn/view?usp=drivesdk',
            'bandwidth.svg':'https://drive.google.com/file/d/1H--_1NECyW2zuyNulNSvFo7-I5sTsPP2/view?usp=drivesdk',
            'dock-mst.svg':'https://drive.google.com/file/d/1eB_j-Hdr9mlw7-v1YtSQESSxi5sQgEeu/view?usp=drivesdk',
            'audio-io.svg':'https://drive.google.com/file/d/1MfnZuUlxscc-Dh6k15JLgHFA0GcHJnJs/view?usp=drivesdk',
            'troubleshooting-tree.svg':'https://drive.google.com/file/d/1N5RPpMpm3j3ZDU6j2ZI6tGiOx-kpXZ65/view?usp=drivesdk',
            'chroma.svg':'https://drive.google.com/file/d/1oEJg6GxFyUFwFScPD2MzWt0jiOmsT6Dp/view?usp=drivesdk',
            'conference-system.svg':'https://drive.google.com/file/d/1K066wd2LAMklCgkZjqcu82stafSciZEt/view?usp=drivesdk',
          }
          base='https://trexsatya.github.io/db/language/swedish/images/conference-av/'
          for name,url in mapping.items():
            s=s.replace(base+name,url)
          p.write_text(s)
          PY
          rm -rf db/language/swedish/images/conference-av
          rm -f .github/workflows/move-conference-av-images-to-drive.yml
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Store conference AV card images on Drive' || exit 0
          git push
