name: Recover missing cues across all videos (review branch)
on:
  push:
    branches: [recover/all-historical-srt-cues]
    paths:
      - scripts/recover-srt-all-cues.mjs
      - .github/workflows/recover-srt-all-cues.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  recover:
    if: github.repository == 'trexsatya/trexsatya.github.io' && github.ref == 'refs/heads/recover/all-historical-srt-cues'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply recovery and recheck every indexed subtitle language
        run: |
          node scripts/recover-srt-all-cues.mjs --apply
          node scripts/recover-srt-all-cues.mjs --verify
          git diff --check
          git add db/language/swedish/srts/ srt-recovery-report/all-cue-recovery.json
          if git diff --cached --quiet; then
            echo "Expected cue recovery changes, none found"
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Restore all nonconflicting archived subtitle cues and relink language siblings"
          git push origin HEAD:refs/heads/recover/all-historical-srt-cues
