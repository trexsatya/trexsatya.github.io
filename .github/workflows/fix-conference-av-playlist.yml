name: Fix conference AV playlist schema

on:
  push:
    branches:
      - chatgpt/conference-av-flashcards

permissions:
  contents: write

jobs:
  fix-recordings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/conference-av-flashcards
          fetch-depth: 0
      - name: Convert conference AV playlist to current manual-card schema
        shell: python
        run: |
          import json
          from pathlib import Path

          path = Path("db/language/swedish/recordings.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          legacy = data.get("Konferensrum AV", [])
          if not isinstance(legacy, list):
              raise SystemExit("Konferensrum AV is not the expected temporary list")

          cards = []
          for idx, item in enumerate(legacy, start=1):
              cards.append({
                  "manual": True,
                  "id": f"mc-confav-{idx:03d}",
                  "source": item.get("source", ""),
                  "target": item.get("target", ""),
                  "enabled": True,
              })

          stamp = 1792051200000
          data["Konferensrum AV"] = {
              "items": {"Manual": {"Card": cards}},
              "createdAt": stamp,
              "updatedAt": stamp,
          }
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          Path(".github/workflows/fix-conference-av-playlist.yml").unlink(missing_ok=True)
      - name: Commit corrected playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db/language/swedish/recordings.json .github/workflows/fix-conference-av-playlist.yml
          git commit -m "Use current manual-card schema for conference AV playlist"
          git push origin HEAD:chatgpt/conference-av-flashcards
