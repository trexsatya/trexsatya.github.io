name: Enrich conference AV cards
on:
  push:
    branches: [chatgpt/conference-av-visual-scenarios]
    paths: [.github/workflows/enrich-conference-av-cards.yml]
permissions:
  contents: write
jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/conference-av-visual-scenarios
      - name: Add scenarios and diagrams to cards
        shell: python
        run: |
          import json, time, html
          from pathlib import Path

          path = Path('db/language/swedish/recordings.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          deck = data['Konferensrum AV']
          cards = deck['items']['Manual']['Card']
          by_id = {c.get('id'): c for c in cards}
          base = 'https://trexsatya.github.io/db/language/swedish/images/conference-av/'

          images = {
            'signal': base + 'signal-chain.svg',
            'usb': base + 'usb-c-functions.svg',
            'handshake': base + 'handshake-edid-hdcp.svg',
            'bandwidth': base + 'bandwidth.svg',
            'dock': base + 'dock-mst.svg',
            'audio': base + 'audio-io.svg',
            'tree': base + 'troubleshooting-tree.svg',
            'chroma': base + 'chroma.svg',
            'system': base + 'conference-system.svg',
          }

          def with_image(text, key):
              if '<img ' in str(text):
                  return text
              return f'<div>{html.escape(str(text))}</div><br><img src="{images[key]}" alt="Konferensrum AV – {key}" width="100%">'

          # Visual reinforcement for foundational cards.
          foundational = {
            'mc-confav-001': 'signal',
            'mc-confav-010': 'usb',
            'mc-confav-016': 'handshake',
            'mc-confav-018': 'handshake',
            'mc-confav-020': 'handshake',
            'mc-confav-024': 'bandwidth',
            'mc-confav-027': 'chroma',
            'mc-confav-028': 'chroma',
            'mc-confav-034': 'dock',
            'mc-confav-035': 'dock',
            'mc-confav-038': 'audio',
            'mc-confav-039': 'audio',
            'mc-confav-055': 'tree',
          }
          for cid, key in foundational.items():
              if cid in by_id:
                  by_id[cid]['target'] = with_image(by_id[cid]['target'], key)

          scenarios = [
            ('mc-confav-056', 'Scenario: Projektorn visar “No Signal” och Windows upptäcker inte någon extern skärm. Vad är ett bra första felsökningssteg?', 'Börja nära datorn: kontrollera port, adapter eller docka och kabelanslutning. Testa gärna en känd fungerande kabel eller direktanslutning för att se om datorn kan upptäcka skärmen.', 'tree'),
            ('mc-confav-057', 'Scenario: Windows upptäcker projektorn som en extern skärm, men projektorn visar fortfarande “No Signal”. Vad blir mer misstänkt?', 'Projektorns valda input eller en del längre fram i signalvägen, till exempel switch, vägguttag, extender eller kabel mellan rumsutrustningen och projektorn.', 'signal'),
            ('mc-confav-058', 'Scenario: Bilden fungerar när datorn kopplas direkt till projektorn men inte via rummets vägguttag. Vad har testet visat?', 'Datorns videoutgång och projektorn fungerar sannolikt. Felet ligger troligen i den del som förbikopplades: vägguttag, intern kabel, switch, extender eller annan rumsinfrastruktur.', 'signal'),
            ('mc-confav-059', 'Scenario: Direkt HDMI från datorn fungerar, men bild via USB-C-dockan gör det inte. Vad isolerar du härnäst?', 'Dockan och USB-C-vägen. Kontrollera att datorns USB-C-port stöder video, att kabeln är en fullfunktionskabel och att dockan stöder önskad bildutgång.', 'usb'),
            ('mc-confav-060', 'Scenario: En annan laptop fungerar direkt med samma kabel och projektor. Vad pekar det på?', 'Problemet ligger sannolikt i den första datorn, dess port, adapter, drivrutin eller bildskärmsinställningar snarare än i projektorn eller kabeln.', 'tree'),
            ('mc-confav-061', 'Scenario: Samma laptop misslyckas i flera olika konferensrum. Vad blir huvudmisstanken?', 'Laptopens egen videoutgång, adapter eller docka, dess drivrutiner eller inställningar. Ett fel som följer med enheten är ofta lokalt till enheten eller dess tillbehör.', 'tree'),
            ('mc-confav-062', 'Scenario: Bilden försvinner när HDMI-kabeln rörs vid kontakten. Vad misstänker du?', 'Ett mekaniskt kabel- eller kontaktfel, till exempel glapp kontakt, skadad kabel eller sliten port.', 'signal'),
            ('mc-confav-063', 'Scenario: 1080p60 är helt stabilt men 4K60 blinkar och tappar signal. Vilken hypotes testar du först?', 'Bandbredd eller signalkvalitet. Prova exempelvis 4K30, kortare eller bättre kabel, eller förbikoppla docka, switch eller extender.', 'bandwidth'),
            ('mc-confav-064', 'Scenario: 4K-bild visas, men liten text ser ovanligt suddig eller färgfransig ut. Vad bör du kontrollera?', 'Att den faktiska upplösningen är korrekt och om signalen använder kraftig chroma-subsampling. För datorgrafik ger 4:4:4 normalt skarpare text.', 'chroma'),
            ('mc-confav-065', 'Scenario: Skrivbord och PowerPoint fungerar, men skyddad streamingvideo blir svart på projektorn. Vad är den starkaste misstanken?', 'HDCP. Någon del av bildkedjan kan sakna stöd, ha kompatibilitetsproblem eller misslyckas med autentiseringen.', 'handshake'),
            ('mc-confav-066', 'Scenario: Bild via HDMI fungerar men ljudet kommer fortfarande ur laptopens högtalare. Vad kontrollerar du?', 'Datorns valda ljudutgång. Välj HDMI-, skärm- eller konferensrumsenheten som Output om ljudet ska gå den vägen.', 'audio'),
            ('mc-confav-067', 'Scenario: Distansdeltagarna hör sitt eget tal som eko. Vilket grundproblem misstänker du?', 'Rummets högtalarljud fångas upp av mikrofonen utan tillräcklig ekokompensation, eller fel ljudenheter används så att AEC inte fungerar som tänkt.', 'audio'),
            ('mc-confav-068', 'Scenario: Du hör deltagarna i Teams, men de hör inte dig. Vad felsöker du först?', 'Mikrofonens input: rätt mikrofon vald, inte mutad, appens mikrofonbehörighet och om nivåmätaren reagerar när du talar.', 'audio'),
            ('mc-confav-069', 'Scenario: Kameran fungerar i en annan app men inte i Teams eller Zoom. Vad pekar det mot?', 'Appspecifika inställningar, behörigheter eller att fel kamera är vald, snarare än ett rent hårdvarufel.', 'system'),
            ('mc-confav-070', 'Scenario: En USB-kamera försvinner när flera andra USB-enheter ansluts till samma docka. Vad kan orsaka det?', 'Begränsad USB-bandbredd, effekt eller ett problem i hubben eller dockan. Testa kameran direkt eller koppla bort andra USB-enheter.', 'system'),
            ('mc-confav-071', 'Scenario: Bilden blir svart i en sekund när du byter upplösning och kommer sedan tillbaka. Är det alltid ett fel?', 'Nej. En kort svartbild kan uppstå när länken synkroniserar om och en ny HDMI- eller DisplayPort-handshake görs. Upprepade eller långvariga avbrott är däremot felsymtom.', 'handshake'),
            ('mc-confav-072', 'Scenario: Dockan ger ingen bild förrän dess egen nätadapter kopplas in. Vad lär du dig av det?', 'Dockan behövde extern ström för att driva sin elektronik eller anslutna enheter korrekt. Strömförsörjning är därför en del av felsökningskedjan.', 'dock'),
            ('mc-confav-073', 'Scenario: USB-C laddar datorn, men varken skärm eller USB-enheter via samma kabel fungerar. Varför bevisar laddningen inte att kabeln är fullt fungerande?', 'Ström kan fungera separat från höghastighetsdata och video. Kabeln eller porten kan stödja laddning men sakna eller ha fel på de ledare och funktioner som behövs för data och DisplayPort Alt Mode.', 'usb'),
            ('mc-confav-074', 'Scenario: En HDMI-switch fungerar med två datorer men inte med en tredje. Vad bör du jämföra?', 'Den tredje datorns upplösning, uppdateringsfrekvens, HDCP- och EDID-beteende samt adapter. Testa en enklare bildtiming och direktanslutning för att skilja kapacitets- från kompatibilitetsproblem.', 'handshake'),
            ('mc-confav-075', 'Scenario: Datorn fungerar direkt till projektorn men inte genom en HDMI-extender. Vad testar du?', 'Extendern och dess länk: kategori-kabel, sändare/mottagare, ström och stödd upplösning eller bandbredd. Sänk upplösningen som diagnostiskt test.', 'signal'),
            ('mc-confav-076', 'Scenario: Bilden visas men kanterna är avskurna på projektorn. Vad kontrollerar du?', 'Projektorns aspect ratio, zoom eller overscan samt datorns upplösning och skalning. Målet är en native eller stödd timing utan beskärning.', 'bandwidth'),
            ('mc-confav-077', 'Scenario: Utöka fungerar, men Duplicera ger fel upplösning eller ingen bild. Varför kan lägena bete sig olika?', 'Duplicera kräver ett gemensamt bildläge som båda skärmarna kan använda. Om deras EDID och stödda timings skiljer sig mycket kan spegling välja ett problematiskt kompromissläge.', 'handshake'),
            ('mc-confav-078', 'Scenario: En extern 4K-skärm fungerar via dockan, men den andra blir svart när du ansluter två. Vad undersöker du?', 'Dockans och datorns gränser för antal skärmar, MST och total displaybandbredd. Två utgångar betyder inte automatiskt att vilken kombination av upplösning och Hz som helst stöds.', 'dock'),
            ('mc-confav-079', 'Scenario: Efter att HDMI ansluts blir mötet plötsligt tyst trots att bilden fungerar. Vad kan ha hänt?', 'Operativsystemet kan automatiskt ha bytt ljudutgång till HDMI-skärmen eller projektorn. Kontrollera Output-enheten i systemet och mötesappen.', 'audio'),
            ('mc-confav-080', 'Scenario: Du har ett intermittent AV-fel. Vilken arbetsmetod ger bäst chans att hitta orsaken?', 'Reproducera felet, följ signalvägen, förenkla kedjan, byt en komponent eller variabel i taget, retesta efter varje ändring och dokumentera vad som faktiskt ändrade beteendet.', 'tree'),
          ]

          existing = {c.get('id') for c in cards}
          for cid, source, target, image_key in scenarios:
              if cid not in existing:
                  cards.append({
                    'manual': True,
                    'id': cid,
                    'source': source,
                    'target': with_image(target, image_key),
                    'enabled': True
                  })

          deck['updatedAt'] = int(time.time() * 1000)
          ids = [c.get('id') for c in cards]
          assert len(ids) == len(set(ids)), 'duplicate card IDs'
          assert all(c.get('source') and c.get('target') is not None for c in cards), 'invalid cards'
          assert all(f'mc-confav-{n:03d}' in ids for n in range(1, 81)), 'expected 80 AV cards'
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('Conference AV cards:', sum(i.startswith('mc-confav-') for i in ids))
      - name: Remove this one-time workflow and commit
        run: |
          rm .github/workflows/enrich-conference-av-cards.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db/language/swedish/recordings.json .github/workflows/enrich-conference-av-cards.yml
          git commit -m "Add visual troubleshooting scenarios to conference AV deck"
          git push origin HEAD:chatgpt/conference-av-visual-scenarios
