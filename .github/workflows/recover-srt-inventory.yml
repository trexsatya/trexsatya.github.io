name: Recover historical subtitle inventory (review branch only)
on:
  push:
    branches: [recover/srt-missing-eWKShBhCSCQ]
    paths:
      - scripts/recover-srt-inventory.mjs
      - scripts/recover-srt-inventory.test.mjs
      - scripts/verify-srt-recovery.mjs
      - .github/workflows/recover-srt-inventory.yml
      - db/language/swedish/srts/**
      - srt-recovery-report/**
  pull_request:
    types: [synchronize]
    paths:
      - scripts/recover-srt-inventory.mjs
      - scripts/recover-srt-inventory.test.mjs
      - scripts/verify-srt-recovery.mjs
      - .github/workflows/recover-srt-inventory.yml
      - db/language/swedish/srts/**
      - srt-recovery-report/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: recover/srt-missing-eWKShBhCSCQ
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test renamed tracks, historical alternatives, preservation and idempotence
        run: node --test scripts/recover-srt-inventory.test.mjs
      - name: Verify all current and historical text against immutable snapshots
        run: node scripts/verify-srt-recovery.mjs
      - name: Verify no historical tracks remain to restore
        run: node scripts/recover-srt-inventory.mjs
      - name: Verify recovery is idempotent
        run: |
          node scripts/recover-srt-inventory.mjs --apply
          git diff --exit-code -- db/language/swedish/srts/ srt-recovery-report/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-subtitle-recovery-audit
          path: |
            srt-recovery-report/report.json
            srt-recovery-report/README.md
