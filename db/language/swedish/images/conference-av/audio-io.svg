<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560"><rect width="1200" height="560" rx="28" fill="#f8fafc"/><text x="60" y="65" font-family="Arial" font-size="34" font-weight="700" fill="#1f2937">Ljud är två separata riktningar</text><text x="60" y="108" font-family="Arial" font-size="20" fill="#475569">Att du hör andra bevisar inte att mikrofonen fungerar.</text><g font-family="Arial"><rect x="95" y="190" width="240" height="120" rx="20" fill="#fff" stroke="#334155" stroke-width="3"/><text x="215" y="240" font-size="28" font-weight="700" text-anchor="middle" fill="#111827">Du pratar</text><text x="215" y="280" font-size="22" text-anchor="middle" fill="#475569">🎙 Mikrofon</text><rect x="480" y="190" width="240" height="120" rx="20" fill="#e2e8f0" stroke="#334155" stroke-width="3"/><text x="600" y="240" font-size="28" font-weight="700" text-anchor="middle" fill="#111827">Teams / Zoom</text><text x="600" y="280" font-size="19" text-anchor="middle" fill="#475569">väljer egna enheter</text><rect x="865" y="190" width="240" height="120" rx="20" fill="#fff" stroke="#334155" stroke-width="3"/><text x="985" y="240" font-size="28" font-weight="700" text-anchor="middle" fill="#111827">De andra</text><text x="985" y="280" font-size="22" text-anchor="middle" fill="#475569">🔊 Högtalare</text><path d="M335 220H480" stroke="#16a34a" stroke-width="7"/><path d="M720 220H865" stroke="#16a34a" stroke-width="7"/><path d="M865 290H720" stroke="#2563eb" stroke-width="7"/><path d="M480 290H335" stroke="#2563eb" stroke-width="7"/><text x="408" y="198" font-size="18" text-anchor="middle" fill="#166534">INPUT</text><text x="792" y="198" font-size="18" text-anchor="middle" fill="#166534">ut till nätet</text><text x="792" y="335" font-size="18" text-anchor="middle" fill="#1d4ed8">in från nätet</text><text x="408" y="335" font-size="18" text-anchor="middle" fill="#1d4ed8">OUTPUT</text><rect x="155" y="395" width="890" height="90" rx="20" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/><text x="600" y="433" font-size="21" text-anchor="middle" fill="#7c2d12">Hör du dem men de hör inte dig?</text><text x="600" y="464" font-size="19" text-anchor="middle" fill="#7c2d12">Felsök mikrofonens input, mute, behörighet och nivåmätare.</text></g></svg>