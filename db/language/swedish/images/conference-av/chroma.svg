<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560"><rect width="1200" height="560" rx="28" fill="#f8fafc"/><text x="60" y="65" font-family="Arial" font-size="34" font-weight="700" fill="#1f2937">Chroma: varför text kan bli mjuk trots rätt fokus</text><text x="60" y="108" font-family="Arial" font-size="20" fill="#475569">4:4:4 behåller full färgupplösning. 4:2:0 sparar bandbredd genom att dela färginformation.</text><g font-family="Arial" text-anchor="middle"><text x="325" y="165" font-size="28" font-weight="700" fill="#111827">4:4:4</text><text x="875" y="165" font-size="28" font-weight="700" fill="#111827">4:2:0</text><g stroke="#334155" stroke-width="2"><rect x="135" y="205" width="95" height="95" fill="#fecaca"/><rect x="230" y="205" width="95" height="95" fill="#bfdbfe"/><rect x="325" y="205" width="95" height="95" fill="#bbf7d0"/><rect x="420" y="205" width="95" height="95" fill="#fde68a"/><rect x="135" y="300" width="95" height="95" fill="#ddd6fe"/><rect x="230" y="300" width="95" height="95" fill="#fed7aa"/><rect x="325" y="300" width="95" height="95" fill="#a7f3d0"/><rect x="420" y="300" width="95" height="95" fill="#bae6fd"/></g><g stroke="#334155" stroke-width="2"><rect x="685" y="205" width="190" height="190" fill="#fecaca"/><rect x="875" y="205" width="190" height="190" fill="#bfdbfe"/></g><text x="325" y="438" font-size="20" fill="#475569">Varje pixel har egen färginformation</text><text x="875" y="438" font-size="20" fill="#475569">Färg delas över flera pixlar</text><text x="600" y="505" font-size="22" font-weight="700" fill="#334155">För Excel, kod och små bokstäver: föredra RGB / 4:4:4 när möjligt.</text></g></svg>