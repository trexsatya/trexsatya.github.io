<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520"><rect width="1200" height="520" rx="28" fill="#f8fafc"/><text x="60" y="68" font-family="Arial" font-size="34" font-weight="700" fill="#1f2937">USB-C är kontaktformen, inte garantin</text><text x="60" y="108" font-family="Arial" font-size="20" fill="#475569">Samma kontakt kan bära olika kombinationer av funktioner.</text><rect x="455" y="165" width="290" height="95" rx="45" fill="#ffffff" stroke="#334155" stroke-width="5"/><rect x="520" y="192" width="160" height="42" rx="20" fill="#e2e8f0"/><text x="600" y="315" font-family="Arial" font-size="28" font-weight="700" text-anchor="middle" fill="#111827">USB-C</text><g font-family="Arial" font-size="22" text-anchor="middle"><g fill="#fff" stroke="#64748b" stroke-width="3"><rect x="70" y="365" width="220" height="95" rx="18"/><rect x="345" y="365" width="220" height="95" rx="18"/><rect x="635" y="365" width="220" height="95" rx="18"/><rect x="910" y="365" width="220" height="95" rx="18"/></g><text x="180" y="412" fill="#111827">⚡ Ström</text><text x="180" y="442" fill="#475569" font-size="17">Power Delivery</text><text x="455" y="412" fill="#111827">↔ USB-data</text><text x="455" y="442" fill="#475569" font-size="17">mus, nätverk, lagring</text><text x="745" y="412" fill="#111827">🖥 Video</text><text x="745" y="442" fill="#475569" font-size="17">DP Alt Mode</text><text x="1020" y="412" fill="#111827">⚡ Thunderbolt</text><text x="1020" y="442" fill="#475569" font-size="17">data + video + mer</text></g><g stroke="#64748b" stroke-width="4"><line x1="600" y1="330" x2="180" y2="365"/><line x1="600" y1="330" x2="455" y2="365"/><line x1="600" y1="330" x2="745" y2="365"/><line x1="600" y1="330" x2="1020" y2="365"/></g></svg>