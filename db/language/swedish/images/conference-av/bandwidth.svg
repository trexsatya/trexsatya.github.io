<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540"><rect width="1200" height="540" rx="28" fill="#f8fafc"/><text x="60" y="66" font-family="Arial" font-size="34" font-weight="700" fill="#1f2937">Vad driver videobandbredden?</text><text x="60" y="108" font-family="Arial" font-size="20" fill="#475569">Fler pixlar, fler uppdateringar och mer färginformation kräver mer kapacitet.</text><g font-family="Arial" text-anchor="middle"><rect x="70" y="160" width="235" height="110" rx="18" fill="#fff" stroke="#64748b" stroke-width="3"/><rect x="345" y="160" width="235" height="110" rx="18" fill="#fff" stroke="#64748b" stroke-width="3"/><rect x="620" y="160" width="235" height="110" rx="18" fill="#fff" stroke="#64748b" stroke-width="3"/><rect x="895" y="160" width="235" height="110" rx="18" fill="#fff" stroke="#64748b" stroke-width="3"/><text x="187" y="205" font-size="23" font-weight="700" fill="#111827">Upplösning</text><text x="187" y="240" font-size="18" fill="#475569">1080p → 4K</text><text x="462" y="205" font-size="23" font-weight="700" fill="#111827">Hz</text><text x="462" y="240" font-size="18" fill="#475569">30 → 60 → 120</text><text x="737" y="205" font-size="23" font-weight="700" fill="#111827">Färgdjup</text><text x="737" y="240" font-size="18" fill="#475569">8 → 10 → 12 bit</text><text x="1012" y="205" font-size="23" font-weight="700" fill="#111827">Chroma</text><text x="1012" y="240" font-size="18" fill="#475569">4:2:0 → 4:4:4</text></g><g stroke="#64748b" stroke-width="4"><line x1="187" y1="270" x2="187" y2="325"/><line x1="462" y1="270" x2="462" y2="325"/><line x1="737" y1="270" x2="737" y2="325"/><line x1="1012" y1="270" x2="1012" y2="325"/></g><rect x="120" y="330" width="960" height="70" rx="22" fill="#e2e8f0"/><text x="600" y="375" font-family="Arial" font-size="28" font-weight="700" text-anchor="middle" fill="#111827">TOTALT BANDBREDDSBEHOV</text><text x="150" y="460" font-family="Arial" font-size="22" fill="#334155">1080p60</text><rect x="290" y="435" width="210" height="36" rx="12" fill="#94a3b8"/><text x="650" y="460" font-family="Arial" font-size="22" fill="#334155">4K60</text><rect x="760" y="435" width="360" height="36" rx="12" fill="#475569"/></svg>